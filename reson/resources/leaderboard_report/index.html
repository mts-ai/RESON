<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MWS AI RESON — Подиум моделей</title>
    <style>
      .reson-boot {
        font-family: system-ui, -apple-system, sans-serif;
        padding: 1.5rem;
        max-width: 28rem;
        color: #4b5563;
        line-height: 1.45;
      }
      .reson-boot strong { color: #111827; }
    </style>
    <script>
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem('reson-leaderboard-theme-mode');
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(mode);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="reson-boot">
        <p><strong>Загрузка отчёта MWS AI RESON…</strong></p>
        <p>Если страница остаётся пустой, откройте файл в Safari через «Поделиться → Safari», а не в приложении «Файлы».</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
